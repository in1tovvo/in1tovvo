{% extends "base.html" %}

{% block title %}{{ '编辑宾客' if guest else '添加宾客' }} - 备婚大作战{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h4 class="mb-0"><i class="bi bi-{{ 'person-write' if guest else 'person-plus' }} me-2"></i>{{ '编辑宾客' if guest else '添加宾客' }}</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">姓名 <span class="text-danger">*</span></label>
                            <input type="text" name="name" class="form-control" value="{{ guest.name if guest else '' }}" required>
                        </div>
                        
                        <div class="col-md-6 mb-3">
                            <label class="form-label">联系电话</label>
                            <input type="tel" name="phone" class="form-control" value="{{ guest.phone if guest else '' }}">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">邮箱</label>
                            <input type="email" name="email" class="form-control" value="{{ guest.email if guest else '' }}">
                        </div>
                        
                        <div class="col-md-6 mb-3">
                            <label class="form-label">与新人关系</label>
                            <input type="text" name="relationship" class="form-control" value="{{ guest.relationship if guest else '' }}" placeholder="如：同事、同学、亲戚">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">所属方</label>
                            <select name="side" class="form-select">
                                <option value="both" {{ 'selected' if guest and guest.side == 'both' else '' }}>双方</option>
                                <option value="bride" {{ 'selected' if guest and guest.side == 'bride' else '' }}>女方</option>
                                <option value="groom" {{ 'selected' if guest and guest.side == 'groom' else '' }}>男方</option>
                            </select>
                        </div>
                        
                        <div class="col-md-6 mb-3">
                            <label class="form-label">桌号</label>
                            <input type="number" name="table_number" class="form-control" min="0" value="{{ guest.table_number if guest else '' }}">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">邀请状态</label>
                            <select name="invitation_status" class="form-select">
                                <option value="pending" {{ 'selected' if guest and guest.invitation_status == 'pending' else '' }}>待发送</option>
                                <option value="sent" {{ 'selected' if guest and guest.invitation_status == 'sent' else '' }}>已发送</option>
                                <option value="delivered" {{ 'selected' if guest and guest.invitation_status == 'delivered' else '' }}>已送达</option>
                            </select>
                        </div>
                        
                        <div class="col-md-6 mb-3">
                            <label class="form-label">RSVP回复</label>
                            <select name="rsvp_status" class="form-select">
                                <option value="no_response" {{ 'selected' if guest and guest.rsvp_status == 'no_response' else '' }}>待回复</option>
                                <option value="yes" {{ 'selected' if guest and guest.rsvp_status == 'yes' else '' }}>参加</option>
                                <option value="no" {{ 'selected' if guest and guest.rsvp_status == 'no' else '' }}>不参加</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <div class="form-check">
                            <input type="checkbox" name="plus_one" class="form-check-input" id="plusOne" {{ 'checked' if guest and guest.plus_one else '' }}>
                            <label class="form-check-label" for="plusOne">允许携带一位同伴</label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">饮食禁忌</label>
                        <textarea name="dietary_restrictions" class="form-control" rows="2" 
                                  placeholder="如：素食、清真、过敏等">{{ guest.dietary_restrictions if guest else '' }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">礼金预估 (¥)</label>
                        <input type="number" name="gift_amount" class="form-control" step="0.01" min="0" value="{{ guest.gift_amount if guest else '' }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">备注</label>
                        <textarea name="notes" class="form-control" rows="2">{{ guest.notes if guest else '' }}</textarea>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('guests') }}" class="btn btn-outline-secondary">返回列表</a>
                        <button type="submit" class="btn btn-primary">{{ '保存' if guest else '添加宾客' }}</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
