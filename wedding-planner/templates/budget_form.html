{% extends "base.html" %}

{% block title %}{{ '编辑预算' if budget else '添加预算' }} - 备婚大作战{% endblock %}

{% block extra_css %}
<style>
    .form-section {
        background: #f8f9fa;
        padding: 1.5rem;
        border-radius: 8px;
        margin-bottom: 1rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h4 class="mb-0"><i class="bi bi-{{ 'pencil-square' if budget else 'cash-stack' }} me-2 text-pink"></i>{{ '编辑预算' if budget else '添加预算项目' }}</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">分类 <span class="text-danger">*</span></label>
                            <select name="category" class="form-select" required>
                                <option value="">请选择</option>
                                {% for cat in categories %}
                                <option value="{{ cat }}" {{ 'selected' if budget and budget.category == cat else '' }}>{{ cat }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="col-md-6 mb-3">
                            <label class="form-label">项目名称 <span class="text-danger">*</span></label>
                            <input type="text" name="item_name" class="form-control" value="{{ budget.item_name if budget else '' }}" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">预算金额 (¥)</label>
                            <input type="number" name="estimated_cost" class="form-control" step="0.01" min="0" value="{{ budget.estimated_cost if budget else '' }}">
                        </div>
                        
                        <div class="col-md-4 mb-3">
                            <label class="form-label">实际支出 (¥)</label>
                            <input type="number" name="actual_cost" class="form-control" step="0.01" min="0" value="{{ budget.actual_cost if budget else '' }}">
                        </div>
                        
                        <div class="col-md-4 mb-3">
                            <label class="form-label">定金 (¥)</label>
                            <input type="number" name="deposit" class="form-control" step="0.01" min="0" value="{{ budget.deposit if budget else 0 }}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">尾款 (¥)</label>
                        <input type="number" name="balance" class="form-control" step="0.01" min="0" value="{{ budget.balance if budget else 0 }}">
                        <small class="text-muted">应付款 = 实际支出 - 定金</small>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">供应商名称</label>
                            <input type="text" name="vendor" class="form-control" value="{{ budget.vendor if budget else '' }}">
                        </div>
                        
                        <div class="col-md-6 mb-3">
                            <label class="form-label">联系方式</label>
                            <input type="text" name="vendor_contact" class="form-control" value="{{ budget.vendor_contact if budget else '' }}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">状态</label>
                        <select name="status" class="form-select">
                            <option value="pending" {{ 'selected' if budget and budget.status == 'pending' else '' }}>待支付</option>
                            <option value="completed" {{ 'selected' if budget and budget.status == 'completed' else '' }}>已完成支付</option>
                            <option value="cancelled" {{ 'selected' if budget and budget.status == 'cancelled' else '' }}>已取消</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">备注</label>
                        <textarea name="notes" class="form-control" rows="3" 
                                  placeholder="合同细节、付款节点、备注事项...">{{ budget.notes if budget else '' }}</textarea>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('budget') }}" class="btn btn-outline-secondary">返回列表</a>
                        <button type="submit" class="btn btn-{{ 'primary' if not budget else 'success' }}">
                            <i class="bi bi-{{ 'plus-circle' if not budget else 'check-circle' }} me-1"></i>
                            {{ '添加' if not budget else '保存' }}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
