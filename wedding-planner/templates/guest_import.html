{% extends "base.html" %}

{% block title %}导入宾客 - 备婚大作战{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h4 class="mb-0"><i class="bi bi-upload me-2"></i>批量导入宾客</h4>
            </div>
            <div class="card-body">
                <form method="POST" enctype="multipart/form-data">
                    <div class="mb-4">
                        <label class="form-label">CSV文件 <span class="text-danger">*</span></label>
                        <input type="file" name="file" class="form-control" accept=".csv" required>
                        <div class="form-text">
                            请上传CSV格式的文件。<br>
                            支持的列（顺序不限）：<br>
                            <code>姓名, 电话, 邮箱, 关系, 所属方(bride/groom/both), 备注</code>
                        </div>
                    </div>

                    <div class="alert alert-info">
                        <i class="bi bi-info-circle me-2"></i>
                        <strong>格式示例：</strong><br>
                        张三, 13800138000, zhang@example.com, 同事, bride, 需要素食
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('guests') }}" class="btn btn-outline-secondary">取消</a>
                        <button type="submit" class="btn btn-primary">开始导入</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
